<!doctype html><meta charset=utf-8>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#0d1117;overflow:hidden;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;color:#e6edf3;position:relative}
.glow{position:absolute;width:900px;height:900px;left:-260px;top:-380px;border-radius:50%;
  background:radial-gradient(circle,rgba(88,166,255,.16),transparent 62%)}
.glow2{position:absolute;width:700px;height:700px;right:-220px;bottom:-340px;border-radius:50%;
  background:radial-gradient(circle,rgba(248,81,73,.13),transparent 62%)}
.wrap{position:relative;padding:92px 80px 78px;height:100%;display:flex;flex-direction:column}
.eyebrow{font:600 20px ui-monospace,'Cascadia Code',Consolas,monospace;color:#58a6ff;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:77px;line-height:1.06;font-weight:760;letter-spacing:-.028em;margin-top:26px;max-width:1060px}
h1 .off{color:#f85149}
.sub{margin-top:26px;font-size:29px;line-height:1.42;color:#9198a1;max-width:1010px;font-weight:400}
.sub b{color:#e6edf3;font-weight:640}
.spacer{flex:1}
.foot{display:flex;align-items:center;gap:22px;font:15px ui-monospace,'Cascadia Code',Consolas,monospace;color:#7d8590}
.pill{border:1px solid #30363d;border-radius:999px;padding:9px 20px;background:#161b22;color:#c9d1d9;font-size:15px}
.dot{width:5px;height:5px;border-radius:50%;background:#30363d}
.rule{position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,#58a6ff 0%,#bc8cff 42%,#f85149 100%)}
</style>
<div class=glow></div><div class=glow2></div>
<div class=wrap>
  <div class=eyebrow>tanvoid0 / claude-code-plugins</div>
  <h1>A token budget for Claude&nbsp;Code<br>the agent <span class=off>can't turn off</span>.</h1>
  <div class=sub>Plus <b>six subagents</b>, each pinned to the cheapest model that holds.</div>
  <div class=spacer></div>
  <div class=foot>
    <span class=pill>governor</span>
    <span class=pill>crew</span>
    <span class=dot></span>
    <span>zero dependencies</span>
    <span class=dot></span>
    <span>hooks cost 0 context tokens</span>
    <span class=dot></span>
    <span>MIT</span>
  </div>
</div>
<div class=rule></div>
